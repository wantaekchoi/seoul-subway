# 확장을 묶는다. 푸시하면 zip 이 아티팩트로 남고, 스토어에는 사람이 올린다.
#
# 스토어 API 자동 업로드는 안 쓴다. 아끼는 건 zip 하나 끌어다 놓는 30초인데,
# 대가로 계정의 모든 확장에 업로드할 수 있는 자격증명이 저장소에 상주하고
# 토큰 만료를 계속 돌봐야 한다. 값나가는 절반 — 묶고 검사해서 내주는 것 — 은
# 여기서 이미 한다.
name: extension

on:
  push:
    branches: [main]
    paths: ['manifest.json', 'newtab.*', 'style.css', 'src/**', 'data/**', 'icon/**', 'tools/pack-newtab.sh']
  workflow_dispatch:
    inputs:
      bump:
        description: 끝자리 버전을 올린다
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 묶는다
        run: |
          if [ "${{ inputs.bump }}" = "true" ]; then
            ./tools/pack-newtab.sh --bump
          else
            ./tools/pack-newtab.sh
          fi
          echo "VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_ENV"

      # 올린 zip 이 실제로 열리고 매니페스트가 최상위인지 본다. 폴더로 감싸이면 스토어가 거른다.
      - name: 묶음을 확인한다
        run: |
          unzip -t dist.zip > /dev/null
          unzip -l dist.zip | grep -qE ' manifest\.json$' || { echo "manifest.json 이 최상위에 없다"; exit 1; }
          python3 -c "
          import json, zipfile
          m = json.loads(zipfile.ZipFile('dist.zip').read('manifest.json'))
          assert m['manifest_version'] == 3, m
          for p in ('newtab.html', *m['icons'].values()):
              zipfile.ZipFile('dist.zip').getinfo(p)
          print('v' + m['version'], '· 파일', len(zipfile.ZipFile('dist.zip').namelist()))
          "

      - uses: actions/upload-artifact@v4
        with:
          name: seoul-subway-extension-v${{ env.VERSION }}
          path: dist.zip

      - name: 올린 버전을 되돌려 놓는다
        if: inputs.bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "확장 v${{ env.VERSION }}"
          git push
